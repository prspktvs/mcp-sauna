<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">m</span> mcp-sauna</a>
        <nav aria-label="Main navigation">
          <a href="{{ '/rules/v1/' | relative_url }}">Rules v1</a>
          <a href="{{ '/reports/' | relative_url }}">Example reports</a>
          <a class="nav-cta" href="https://github.com/prspktvs/mcp-sauna">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main" class="page-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="footer-wrap">
        <span>mcp-sauna <span class="muted">·</span> Apache-2.0</span>
        <div><a href="{{ '/rules/v1/' | relative_url }}">mcp-sauna rules v1</a><a href="https://github.com/prspktvs/mcp-sauna">Source on GitHub</a></div>
      </div>
    </footer>
  </body>
</html>
